<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">Manage Users - Parking Management System</title>
    <style>
        .user-card { transition: transform 0.2s; }
        .user-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-users me-2"></i>Manage Users</h2>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="roleFilter" class="form-label">Role</label>
                        <select class="form-select" id="roleFilter">
                            <option value="">All Roles</option>
                            <option value="ADMIN">Admin</option>
                            <option value="STAFF">Staff</option>
                            <option value="USER">User</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="statusFilter" class="form-label">Status</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="searchInput" class="form-label">Search</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name, email, or username...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div th:text="${user.firstName + ' ' + user.lastName}">John Doe</div>
                                            <small class="text-muted" th:text="${user.phoneNumber}">+1234567890</small>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${user.username}">johndoe</td>
                                <td th:text="${user.email}">john@example.com</td>
                                <td>
                                    <span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : (user.role.name() == 'STAFF' ? 'bg-warning text-dark' : 'bg-success')}" th:text="${user.role.name()}">USER</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${user.isActive == true ? 'bg-success' : 'bg-secondary'}" th:text="${user.isActive == true ? 'Active' : 'Inactive'}">Active</span>
                                </td>
                                <td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'MMM dd, yyyy') : '-'}">Jan 01, 2024</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-sm btn-outline-info" th:data-user-id="${user.id}" onclick="viewUser(this.dataset.userId)" title="View Details"><i class="fas fa-eye"></i></button>
                                        <button type="button" class="btn btn-sm btn-outline-warning" th:data-user-id="${user.id}" onclick="editUser(this.dataset.userId)" title="Edit User"><i class="fas fa-edit"></i></button>
                                        <button type="button" class="btn btn-sm btn-outline-danger" th:data-user-id="${user.id}" onclick="deactivateUser(this.dataset.userId)" th:disabled="${user.isActive != true}" title="Deactivate User"><i class="fas fa-user-times"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <h5 class="card-title text-primary" th:text="${totalUsers}">0</h5>
                        <p class="card-text mb-0">Total Users</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <h5 class="card-title text-success" th:text="${regularUsers}">0</h5>
                        <p class="card-text mb-0">Regular Users</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <h5 class="card-title text-warning" th:text="${staffUsers}">0</h5>
                        <p class="card-text mb-0">Staff Members</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <h5 class="card-title text-info" th:text="${activeUsers}">0</h5>
                        <p class="card-text mb-0">Active Users</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function deactivateUser(userId) {
                if (confirm('Are you sure you want to deactivate this user?')) {
                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/users/' + userId + '/deactivate';
                    document.body.appendChild(form);
                    form.submit();
                }
            }
            function viewUser(userId) { alert('View user details for ID: ' + userId); }
            function editUser(userId) { alert('Edit user for ID: ' + userId); }
            document.addEventListener('DOMContentLoaded', function() {
                ['roleFilter', 'statusFilter'].forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.addEventListener('change', filterUsers);
                });
                var searchEl = document.getElementById('searchInput');
                if (searchEl) searchEl.addEventListener('input', filterUsers);
            });
            function filterUsers() {
                var roleFilter = (document.getElementById('roleFilter') || {}).value;
                var statusFilter = (document.getElementById('statusFilter') || {}).value;
                var searchInput = ((document.getElementById('searchInput') || {}).value || '').toLowerCase();
                document.querySelectorAll('tbody tr').forEach(function(row) {
                    var name = (row.cells[0] && row.cells[0].textContent || '').toLowerCase();
                    var username = (row.cells[1] && row.cells[1].textContent || '').toLowerCase();
                    var email = (row.cells[2] && row.cells[2].textContent || '').toLowerCase();
                    var role = row.cells[3] ? row.cells[3].textContent : '';
                    var status = row.cells[4] ? row.cells[4].textContent : '';
                    var show = true;
                    if (roleFilter && role !== roleFilter) show = false;
                    if (statusFilter && status !== (statusFilter === 'true' ? 'Active' : 'Inactive')) show = false;
                    if (searchInput && name.indexOf(searchInput) === -1 && username.indexOf(searchInput) === -1 && email.indexOf(searchInput) === -1) show = false;
                    row.style.display = show ? '' : 'none';
                });
            }
        </script>
    </div>
</body>
</html>
