<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">Manage Slots - Parking Management System</title>
    <style>
        .slot-card { transition: transform 0.2s; }
        .slot-card:hover { transform: translateY(-2px); }
        .status-available { background-color: #d4edda; border-color: #c3e6cb; }
        .status-occupied { background-color: #f8d7da; border-color: #f5c6cb; }
        .status-reserved { background-color: #fff3cd; border-color: #ffeaa7; }
        .status-maintenance { background-color: #e2e3e5; border-color: #d6d8db; }
        .status-blocked { background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <div th:fragment="content">
        <span id="csrfHolder" th:if="${_csrf != null}" th:attr="data-token=${_csrf.token}" style="display:none" aria-hidden="true"></span>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-square me-2"></i>Manage Parking Slots</h2>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createSlotModal">
                <i class="fas fa-plus me-2"></i>Add New Slot
            </button>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="floorFilter" class="form-label">Floor</label>
                        <select class="form-select" id="floorFilter">
                            <option value="">All Floors</option>
                            <option value="1">Floor 1</option>
                            <option value="2">Floor 2</option>
                            <option value="3">Floor 3</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="statusFilter" class="form-label">Status</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="AVAILABLE">Available</option>
                            <option value="OCCUPIED">Occupied</option>
                            <option value="RESERVED">Reserved</option>
                            <option value="MAINTENANCE">Maintenance</option>
                            <option value="BLOCKED">Blocked</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="typeFilter" class="form-label">Type</label>
                        <select class="form-select" id="typeFilter">
                            <option value="">All Types</option>
                            <option value="STANDARD">Standard</option>
                            <option value="PREMIUM">Premium</option>
                            <option value="DISABLED">Disabled</option>
                            <option value="EV_CHARGING">EV Charging</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="searchInput" class="form-label">Search</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by slot number...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Slots Grid -->
        <div class="row" id="slotsGrid">
            <div th:each="slot : ${slots}" class="col-md-3 mb-3 slot-item" th:data-floor="${slot.floor}" th:data-status="${slot.status.name()}" th:data-type="${slot.slotType.name()}">
                <div class="card slot-card h-100" th:classappend="${slot.status.name() == 'AVAILABLE' ? 'status-available' : (slot.status.name() == 'OCCUPIED' ? 'status-occupied' : (slot.status.name() == 'RESERVED' ? 'status-reserved' : (slot.status.name() == 'MAINTENANCE' ? 'status-maintenance' : 'status-blocked')))}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="card-title mb-0" th:text="${slot.slotNumber}">A1</h6>
                            <span class="badge" th:classappend="${slot.status.name() == 'AVAILABLE' ? 'bg-success' : (slot.status.name() == 'OCCUPIED' ? 'bg-danger' : (slot.status.name() == 'RESERVED' ? 'bg-warning text-dark' : 'bg-secondary'))}" th:text="${slot.status.name()}">Available</span>
                        </div>
                        <p class="card-text small mb-2">
                            <strong>Floor:</strong> <span th:text="${slot.floor}">1</span><br>
                            <strong>Type:</strong> <span th:text="${slot.slotType.name()}">STANDARD</span><br>
                            <strong>Rate:</strong> ₹<span th:text="${#numbers.formatDecimal(slot.hourlyRate, 1, 2)}">10.00</span>/hr
                        </p>
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-sm btn-outline-success" th:data-slot-id="${slot.id}" data-slot-status="AVAILABLE" onclick="updateSlotStatus(this.dataset.slotId, this.dataset.slotStatus)" th:disabled="${slot.status.name() == 'AVAILABLE'}">Available</button>
                            <button type="button" class="btn btn-sm btn-outline-warning" th:data-slot-id="${slot.id}" data-slot-status="RESERVED" onclick="updateSlotStatus(this.dataset.slotId, this.dataset.slotStatus)" th:disabled="${slot.status.name() == 'RESERVED'}">Reserve</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" th:data-slot-id="${slot.id}" data-slot-status="MAINTENANCE" onclick="updateSlotStatus(this.dataset.slotId, this.dataset.slotStatus)" th:disabled="${slot.status.name() == 'MAINTENANCE'}">Maintenance</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Slot Modal -->
        <div class="modal fade" id="createSlotModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Create New Parking Slot</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/admin/slots/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="slotNumber" class="form-label">Slot Number</label>
                                <input type="text" class="form-control" id="slotNumber" name="slotNumber" required>
                            </div>
                            <div class="mb-3">
                                <label for="floor" class="form-label">Floor</label>
                                <select class="form-select" id="floor" name="floor" required>
                                    <option value="1">Floor 1</option>
                                    <option value="2">Floor 2</option>
                                    <option value="3">Floor 3</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="slotType" class="form-label">Slot Type</label>
                                <select class="form-select" id="slotType" name="slotType" required>
                                    <option value="STANDARD">Standard</option>
                                    <option value="PREMIUM">Premium</option>
                                    <option value="DISABLED">Disabled</option>
                                    <option value="EV_CHARGING">EV Charging</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="hourlyRate" class="form-label">Hourly Rate (₹)</label>
                                <input type="number" class="form-control" id="hourlyRate" name="hourlyRate" step="0.01" min="0" value="10.00" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create Slot</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function updateSlotStatus(slotId, status) {
                if (!confirm('Are you sure you want to update this slot status?')) return;
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/slots/' + slotId + '/status';
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'status';
                input.value = status;
                form.appendChild(input);
                var csrfHolder = document.getElementById('csrfHolder');
                if (csrfHolder && csrfHolder.dataset.token) {
                    var csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = '_csrf';
                    csrfInput.value = csrfHolder.dataset.token;
                    form.appendChild(csrfInput);
                }
                document.body.appendChild(form);
                form.submit();
            }
            document.addEventListener('DOMContentLoaded', function() {
                ['floorFilter', 'statusFilter', 'typeFilter', 'searchInput'].forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.addEventListener(id === 'searchInput' ? 'input' : 'change', filterSlots);
                });
            });
            function filterSlots() {
                var floor = (document.getElementById('floorFilter') || {}).value;
                var status = (document.getElementById('statusFilter') || {}).value;
                var type = (document.getElementById('typeFilter') || {}).value;
                var search = ((document.getElementById('searchInput') || {}).value || '').toLowerCase();
                document.querySelectorAll('.slot-item').forEach(function(row) {
                    var show = true;
                    if (floor && row.dataset.floor !== floor) show = false;
                    if (status && row.dataset.status !== status) show = false;
                    if (type && row.dataset.type !== type) show = false;
                    if (search && (row.querySelector('.card-title') || {}).textContent.toLowerCase().indexOf(search) === -1) show = false;
                    row.style.display = show ? 'block' : 'none';
                });
            }
        </script>
    </div>
</body>
</html>
