<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Parking Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .error-card { background: white; border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.175); padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-card mx-auto" style="max-width: 28rem;">
            <i class="fas fa-lock fa-4x text-danger mb-3"></i>
            <h2>Access Denied</h2>
            <p class="text-muted">You do not have permission to access this page.</p>
            <a th:href="@{/login}" class="btn btn-primary mt-3"><i class="fas fa-sign-in-alt me-2"></i>Back to Login</a>
        </div>
    </div>
</body>
</html>
