<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="${title}" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .sidebar .nav-link:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 1rem 1rem 0 0 !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        .slot-available { background-color: #d4edda; color: #155724; }
        .slot-occupied { background-color: #f8d7da; color: #721c24; }
        .slot-reserved { background-color: #fff3cd; color: #856404; }
        .slot-maintenance { background-color: #d1ecf1; color: #0c5460; }
        .slot-blocked { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-0" sec:authorize="isAuthenticated()">
                <div class="p-3">
                    <h4 class="text-white mb-4">
                        <i class="fas fa-parking me-2"></i>
                        Parking System
                    </h4>
                </div>
                <nav class="nav flex-column px-3">
                    <!-- Admin Menu -->
                    <div sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                        </a>
                        <a class="nav-link" th:href="@{/admin/slots}">
                            <i class="fas fa-square me-2"></i>Manage Slots
                        </a>
                        <a class="nav-link" th:href="@{/admin/users}">
                            <i class="fas fa-users me-2"></i>Manage Users
                        </a>
                        <a class="nav-link" th:href="@{/admin/analytics}">
                            <i class="fas fa-chart-bar me-2"></i>Analytics
                        </a>
                    </div>
                    
                    <!-- Staff Menu -->
                    <div sec:authorize="hasRole('STAFF')">
                        <a class="nav-link" th:href="@{/staff/dashboard}">
                            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                        </a>
                        <a class="nav-link" th:href="@{/staff/entries}">
                            <i class="fas fa-sign-in-alt me-2"></i>Vehicle Entries
                        </a>
                        <a class="nav-link" th:href="@{/staff/exits}">
                            <i class="fas fa-sign-out-alt me-2"></i>Vehicle Exits
                        </a>
                    </div>
                    
                    <!-- User Menu -->
                    <div sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/user/dashboard}">
                            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                        </a>
                        <a class="nav-link" th:href="@{/user/slots}">
                            <i class="fas fa-search me-2"></i>Find Slots
                        </a>
                        <a class="nav-link" th:href="@{/user/bookings}">
                            <i class="fas fa-calendar-check me-2"></i>My Bookings
                        </a>
                        <a class="nav-link" th:href="@{/user/vehicles}">
                            <i class="fas fa-car me-2"></i>My Vehicles
                        </a>
                        <a class="nav-link" th:href="@{/user/profile}">
                            <i class="fas fa-user me-2"></i>Profile
                        </a>
                    </div>
                    
                    <!-- Common Menu -->
                    <hr class="text-white">
                    <a class="nav-link" th:href="@{/logout}">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </a>
                </nav>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content" th:classappend="${sidebar == false ? 'offset-md-3 offset-lg-2' : ''}">
                <!-- Top Navigation -->
                <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4" sec:authorize="isAuthenticated()">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">
                            <i class="fas fa-parking me-2 text-primary"></i>
                            <span th:text="${pageTitle} ?: 'Parking Management'">Parking Management</span>
                        </span>
                        <div class="navbar-nav ms-auto">
                            <div class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-user me-1"></i>
                                    <span sec:authentication="name">User</span>
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" th:href="@{/user/profile}">
                                        <i class="fas fa-user me-2"></i>Profile
                                    </a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" th:href="@{/logout}">
                                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                                    </a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </nav>
                
                <!-- Page Content -->
                <div class="container-fluid px-4">
                    <!-- Alert Messages -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${message}" class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="fas fa-info-circle me-2"></i>
                        <span th:text="${message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <!-- Page Content -->
                    <th:block th:replace="${content}" />
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script th:fragment="scripts">
        // Auto-hide alerts after 5 seconds
        setTimeout(function() {
            $('.alert').fadeOut('slow');
        }, 5000);
        
        // Real-time slot updates
        function updateSlotStatus() {
            $.get('/api/slots/status', function(data) {
                // Update slot status indicators
                console.log('Slot status updated:', data);
            });
        }
        
        // Update every 30 seconds
        setInterval(updateSlotStatus, 30000);
    </script>
</body>
</html>
