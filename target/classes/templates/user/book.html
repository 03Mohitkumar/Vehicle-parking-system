<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">Book Parking Slot - Parking Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-bookmark me-2"></i>Book Parking Slot</h2>
            <a th:href="@{/user/slots}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Slots
            </a>
        </div>
        
        <div class="row">
            <!-- Slot Information -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-square me-2"></i>Slot Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <i class="fas fa-square fa-3x text-success"></i>
                        </div>
                        <h4 class="text-center" th:text="${slot.slotNumber}">A1</h4>
                        <hr>
                        <div class="row">
                            <div class="col-6">
                                <strong>Floor:</strong>
                            </div>
                            <div class="col-6" th:text="${slot.floor}">1</div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <strong>Type:</strong>
                            </div>
                            <div class="col-6">
                                <span class="badge bg-primary" th:text="${slot.slotType.name()}">STANDARD</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <strong>Hourly Rate:</strong>
                            </div>
                            <div class="col-6" th:text="${'₹' + #numbers.formatDecimal(slot.hourlyRate, 1, 2)}">₹5.00</div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <strong>Status:</strong>
                            </div>
                            <div class="col-6">
                                <span class="badge bg-success">Available</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Booking Form -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-calendar-plus me-2"></i>Booking Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/user/book}" method="post">
                            <input type="hidden" name="slotId" th:value="${slot.id}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="vehicleId" class="form-label">
                                        <i class="fas fa-car me-1"></i>Select Vehicle
                                    </label>
                                    <select class="form-select" id="vehicleId" name="vehicleId" required>
                                        <option value="">Choose a vehicle...</option>
                                        <option th:each="vehicle : ${vehicles}" 
                                                th:value="${vehicle.id}" 
                                                th:text="${vehicle.licensePlate + ' - ' + vehicle.make + ' ' + vehicle.model}">
                                            ABC-123 - Toyota Camry
                                        </option>
                                    </select>
                                    <div class="form-text">
                                        <a th:href="@{/user/vehicles}" class="text-decoration-none">
                                            <i class="fas fa-plus me-1"></i>Add new vehicle
                                        </a>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">User Information</label>
                                    <div class="form-control-plaintext">
                                        <strong th:text="${user.fullName}">John Doe</strong><br>
                                        <small class="text-muted" th:text="${user.email}">john@example.com</small>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startTime" class="form-label">
                                        <i class="fas fa-clock me-1"></i>Start Time
                                    </label>
                                    <input type="datetime-local" class="form-control" id="startTime" name="startTime" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="expectedEndTime" class="form-label">
                                        <i class="fas fa-clock me-1"></i>Expected End Time
                                    </label>
                                    <input type="datetime-local" class="form-control" id="expectedEndTime" name="expectedEndTime" required>
                                </div>
                            </div>
                            
                            <!-- Duration and Cost Calculation -->
                            <div class="card bg-light mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">
                                        <i class="fas fa-calculator me-2"></i>Booking Summary
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-2">
                                                <strong>Duration:</strong> <span id="duration">Select start and end time</span>
                                            </div>
                                            <div class="mb-2">
                                                <strong>Hourly Rate:</strong> <span id="hourlyRateDisplay" th:text="${'₹' + #numbers.formatDecimal(slot.hourlyRate, 1, 2)}">₹5.00</span>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-2">
                                                <strong>Total Cost:</strong> <span id="totalCost" class="text-primary fs-5">₹0.00</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/user/slots}" class="btn btn-outline-secondary me-md-2">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-bookmark me-2"></i>Confirm Booking
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:fragment="scripts">
        const hourlyRate = /*[[${slot.hourlyRate}]]*/ 5.00;
        
        function calculateCost() {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('expectedEndTime').value;
            
            if (startTime && endTime) {
                const start = new Date(startTime);
                const end = new Date(endTime);
                
                if (end > start) {
                    const durationMs = end - start;
                    const durationHours = Math.ceil(durationMs / (1000 * 60 * 60)); // Round up to next hour
                    const totalCost = durationHours * hourlyRate;
                    
                    document.getElementById('duration').textContent = durationHours + ' hour' + (durationHours !== 1 ? 's' : '');
                    document.getElementById('totalCost').textContent = '₹' + totalCost.toFixed(2);
                } else {
                    document.getElementById('duration').textContent = 'Invalid time range';
                    document.getElementById('totalCost').textContent = '₹0.00';
                }
            } else {
                document.getElementById('duration').textContent = 'Select start and end time';
                document.getElementById('totalCost').textContent = '₹0.00';
            }
        }
        
        // Set minimum start time to current time
        const now = new Date();
        const minTime = now.toISOString().slice(0, 16);
        document.getElementById('startTime').min = minTime;
        
        // Add event listeners
        document.getElementById('startTime').addEventListener('change', function() {
            const startTime = this.value;
            if (startTime) {
                const start = new Date(startTime);
                const minEndTime = new Date(start.getTime() + 60 * 60 * 1000); // 1 hour later
                document.getElementById('expectedEndTime').min = minEndTime.toISOString().slice(0, 16);
            }
            calculateCost();
        });
        
        document.getElementById('expectedEndTime').addEventListener('change', calculateCost);
        
        // Initial calculation
        calculateCost();
    </script>
</body>
</html>
