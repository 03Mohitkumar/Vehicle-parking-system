<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">My Vehicles - Parking Management System</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .vehicle-card { transition: transform 0.2s; }
            .vehicle-card:hover { transform: translateY(-2px); }
            .vehicle-type-sedan { border-left: 4px solid #007bff; }
            .vehicle-type-suv { border-left: 4px solid #28a745; }
            .vehicle-type-truck { border-left: 4px solid #ffc107; }
            .vehicle-type-motorcycle { border-left: 4px solid #dc3545; }
        </style>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-car me-2"></i>My Vehicles</h2>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
                <i class="fas fa-plus me-2"></i>Add Vehicle
            </button>
        </div>

        <!-- Filter and Search -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="typeFilter" class="form-label">Vehicle Type</label>
                        <select class="form-select" id="typeFilter">
                            <option value="">All Types</option>
                            <option value="SEDAN">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="TRUCK">Truck</option>
                            <option value="MOTORCYCLE">Motorcycle</option>
                        </select>
                    </div>
                    <div class="col-md-9">
                        <label for="searchInput" class="form-label">Search</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by license plate, make, or model...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Vehicles Grid -->
        <div class="row" id="vehiclesGrid">
            <div th:each="vehicle : ${vehicles}" class="col-md-4 mb-3">
                <div class="card vehicle-card h-100" th:classappend="${'vehicle-type-' + vehicle.vehicleType.name().toLowerCase()}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h6 class="card-title mb-1" th:text="${vehicle.licensePlate}">ABC-123</h6>
                                <small class="text-muted" th:text="${vehicle.make + ' ' + vehicle.model}">Toyota Camry</small>
                            </div>
                            <span class="badge bg-secondary" th:text="${vehicle.vehicleType.name()}">SEDAN</span>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <small class="text-muted">Year</small>
                                <div th:text="${vehicle.year}">2020</div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Color</small>
                                <div th:text="${vehicle.color}">Silver</div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <small class="text-muted">Added</small>
                                <div th:text="${vehicle.createdAt != null ? #temporals.format(vehicle.createdAt, 'MMM dd, yyyy') : '-'}">Jan 15, 2024</div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Status</small>
                                <div>
                                    <span class="badge" th:classappend="${vehicle.isActive == true ? 'bg-success' : 'bg-secondary'}" th:text="${vehicle.isActive == true ? 'Active' : 'Inactive'}">Active</span>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-outline-primary" th:data-vehicle-id="${vehicle.id}" onclick="editVehicle(this.dataset.vehicleId)" title="Edit Vehicle">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger" th:data-vehicle-id="${vehicle.id}" onclick="deleteVehicle(this.dataset.vehicleId)" title="Delete Vehicle">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${vehicles != null and vehicles.isEmpty()}" class="text-center py-5">
            <i class="fas fa-car fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">No Vehicles Found</h4>
            <p class="text-muted">You haven't added any vehicles yet. Add your first vehicle to start making bookings!</p>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
                <i class="fas fa-plus me-2"></i>Add Your First Vehicle
            </button>
        </div>

        <!-- Add Vehicle Modal -->
        <div class="modal fade" id="addVehicleModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Vehicle</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/user/vehicles/add}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="licensePlate" class="form-label">License Plate *</label>
                                <input type="text" class="form-control" id="licensePlate" name="licensePlate" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="make" class="form-label">Make *</label>
                                        <input type="text" class="form-control" id="make" name="make" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="model" class="form-label">Model *</label>
                                        <input type="text" class="form-control" id="model" name="model" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="year" class="form-label">Year *</label>
                                        <input type="text" class="form-control" id="year" name="year" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="color" class="form-label">Color *</label>
                                        <input type="text" class="form-control" id="color" name="color" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="vehicleType" class="form-label">Vehicle Type *</label>
                                <select class="form-select" id="vehicleType" name="vehicleType" required>
                                    <option value="SEDAN">Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="TRUCK">Truck</option>
                                    <option value="MOTORCYCLE">Motorcycle</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Add Vehicle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Vehicle Modal -->
        <div class="modal fade" id="editVehicleModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Vehicle</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="editVehicleForm" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="editLicensePlate" class="form-label">License Plate *</label>
                                <input type="text" class="form-control" id="editLicensePlate" name="licensePlate" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="editMake" class="form-label">Make *</label>
                                        <input type="text" class="form-control" id="editMake" name="make" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="editModel" class="form-label">Model *</label>
                                        <input type="text" class="form-control" id="editModel" name="model" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="editYear" class="form-label">Year *</label>
                                        <input type="text" class="form-control" id="editYear" name="year" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="editColor" class="form-label">Color *</label>
                                        <input type="text" class="form-control" id="editColor" name="color" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="editVehicleType" class="form-label">Vehicle Type *</label>
                                <select class="form-select" id="editVehicleType" name="vehicleType" required>
                                    <option value="SEDAN">Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="TRUCK">Truck</option>
                                    <option value="MOTORCYCLE">Motorcycle</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Update Vehicle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function editVehicle(vehicleId) {
                var editModal = new bootstrap.Modal(document.getElementById('editVehicleModal'));
                editModal.show();
            }
            function deleteVehicle(vehicleId) {
                if (confirm('Are you sure you want to delete this vehicle? This action cannot be undone.')) {
                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/user/vehicles/' + vehicleId + '/delete';
                    document.body.appendChild(form);
                    form.submit();
                }
            }
            document.addEventListener('DOMContentLoaded', function() {
                var typeFilter = document.getElementById('typeFilter');
                var searchInput = document.getElementById('searchInput');
                if (typeFilter) typeFilter.addEventListener('change', filterVehicles);
                if (searchInput) searchInput.addEventListener('input', filterVehicles);
            });
            function filterVehicles() {
                var typeFilter = document.getElementById('typeFilter');
                var searchInput = document.getElementById('searchInput');
                if (!typeFilter || !searchInput) return;
                var typeVal = typeFilter.value;
                var searchVal = searchInput.value.toLowerCase();
                var cards = document.querySelectorAll('.vehicle-card');
                cards.forEach(function(card) {
                    var licensePlate = (card.querySelector('.card-title') || {}).textContent || '';
                    var makeModel = (card.querySelector('small') || {}).textContent || '';
                    var badge = card.querySelector('.badge.bg-secondary');
                    var type = badge ? badge.textContent : '';
                    var show = true;
                    if (typeVal && type !== typeVal) show = false;
                    if (searchVal && licensePlate.toLowerCase().indexOf(searchVal) === -1 && makeModel.toLowerCase().indexOf(searchVal) === -1) show = false;
                    var col = card.closest('.col-md-4');
                    if (col) col.style.display = show ? 'block' : 'none';
                });
            }
        </script>
    </div>
</body>
</html>
