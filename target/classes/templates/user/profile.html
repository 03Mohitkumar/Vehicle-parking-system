<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">My Profile - Parking Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row">
            <div class="col-md-8">
                <!-- Profile Information -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user me-2"></i>Profile Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/user/profile/update}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="firstName" class="form-label">First Name *</label>
                                        <input type="text" class="form-control" id="firstName" name="firstName" th:value="${user.firstName}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="lastName" class="form-label">Last Name *</label>
                                        <input type="text" class="form-control" id="lastName" name="lastName" th:value="${user.lastName}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username *</label>
                                        <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email *</label>
                                        <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="phoneNumber" class="form-label">Phone Number *</label>
                                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="role" class="form-label">Role</label>
                                        <input type="text" class="form-control" id="role" th:value="${user.role.name()}" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="createdAt" class="form-label">Member Since</label>
                                        <input type="text" class="form-control" id="createdAt" th:value="${user.createdAt != null ? #temporals.format(user.createdAt, 'MMM dd, yyyy') : '-'}" readonly>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="isActive" class="form-label">Status</label>
                                        <input type="text" class="form-control" id="isActive" th:value="${user.isActive == true ? 'Active' : 'Inactive'}" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Update Profile
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Change Password -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Change Password</h5>
                    </div>
                    <div class="card-body">
                        <form id="changePasswordForm" th:action="@{/user/profile/change-password}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current Password *</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label">New Password *</label>
                                        <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Confirm New Password *</label>
                                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-warning">
                                    <i class="fas fa-key me-2"></i>Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <!-- Profile Summary -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-pie me-2"></i>Profile Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center bg-primary text-white" style="width: 80px; height: 80px; font-size: 2rem;">
                                <i class="fas fa-user"></i>
                            </div>
                            <h5 class="mt-3" th:text="${user.firstName + ' ' + user.lastName}">John Doe</h5>
                            <p class="text-muted mb-0" th:text="${user.email}">john@example.com</p>
                        </div>
                        <div class="list-group list-group-flush">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>Total Bookings</span>
                                <span class="badge bg-primary rounded-pill" th:text="${totalBookings != null ? totalBookings : 0}">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>Active Bookings</span>
                                <span class="badge bg-success rounded-pill" th:text="${activeBookings != null ? activeBookings : 0}">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>Total Vehicles</span>
                                <span class="badge bg-info rounded-pill" th:text="${totalVehicles != null ? totalVehicles : 0}">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>Member Since</span>
                                <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'MMM yyyy') : '-'}">Jan 2024</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a th:href="@{/user/slots}" class="btn btn-outline-primary">
                                <i class="fas fa-parking me-2"></i>View Available Slots
                            </a>
                            <a th:href="@{/user/bookings}" class="btn btn-outline-success">
                                <i class="fas fa-calendar-check me-2"></i>My Bookings
                            </a>
                            <a th:href="@{/user/vehicles}" class="btn btn-outline-info">
                                <i class="fas fa-car me-2"></i>Manage Vehicles
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Account Settings -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-cog me-2"></i>Account Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="emailNotifications" checked>
                            <label class="form-check-label" for="emailNotifications">Email Notifications</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="smsNotifications">
                            <label class="form-check-label" for="smsNotifications">SMS Notifications</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="autoRenewal" checked>
                            <label class="form-check-label" for="autoRenewal">Auto-renewal for bookings</label>
                        </div>
                        <div class="d-grid">
                            <button type="button" class="btn btn-outline-secondary" onclick="saveSettings()">
                                <i class="fas fa-save me-2"></i>Save Settings
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function saveSettings() {
                alert('Settings saved successfully!');
            }
            document.addEventListener('DOMContentLoaded', function() {
                var confirmEl = document.getElementById('confirmPassword');
                if (confirmEl) {
                    confirmEl.addEventListener('input', function() {
                        var newPwd = document.getElementById('newPassword').value;
                        this.setCustomValidity(newPwd !== this.value ? 'Passwords do not match' : '');
                    });
                }
                var changePasswordForm = document.getElementById('changePasswordForm');
                if (changePasswordForm) {
                    changePasswordForm.addEventListener('submit', function(e) {
                        var newPwd = document.getElementById('newPassword').value;
                        var confirmPwd = document.getElementById('confirmPassword').value;
                        if (newPwd !== confirmPwd) {
                            e.preventDefault();
                            alert('Passwords do not match!');
                        }
                    });
                }
            });
        </script>
    </div>
</body>
</html>
