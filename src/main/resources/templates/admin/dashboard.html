<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:fragment="title">Admin Dashboard - Parking Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-tachometer-alt me-2"></i>Admin Dashboard</h2>
            <span class="text-muted">Welcome back, <span th:text="${admin.firstName}">Admin</span>!</span>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-square fa-2x text-success mb-2"></i>
                        <h5 class="card-title">Total Slots</h5>
                        <h3 class="text-primary" th:text="${totalSlots}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                        <h5 class="card-title">Available</h5>
                        <h3 class="text-success" th:text="${availableSlots}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-times-circle fa-2x text-danger mb-2"></i>
                        <h5 class="card-title">Occupied</h5>
                        <h3 class="text-danger" th:text="${occupiedSlots}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                        <h5 class="card-title">Reserved</h5>
                        <h3 class="text-warning" th:text="${reservedSlots}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Statistics -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-users fa-2x text-info mb-2"></i>
                        <h5 class="card-title">Total Users</h5>
                        <h3 class="text-info" th:text="${totalUsers}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-user-tie fa-2x text-secondary mb-2"></i>
                        <h5 class="card-title">Staff Members</h5>
                        <h3 class="text-secondary" th:text="${totalStaff}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-calendar-check fa-2x text-primary mb-2"></i>
                        <h5 class="card-title">Total Bookings</h5>
                        <h3 class="text-primary" th:text="${totalBookings}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions & Chart -->
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a th:href="@{/admin/slots}" class="btn btn-outline-primary">
                                <i class="fas fa-square me-2"></i>Manage Parking Slots
                            </a>
                            <a th:href="@{/admin/users}" class="btn btn-outline-info">
                                <i class="fas fa-users me-2"></i>Manage Users
                            </a>
                            <a th:href="@{/admin/analytics}" class="btn btn-outline-success">
                                <i class="fas fa-chart-bar me-2"></i>View Analytics
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-pie me-2"></i>Slot Status Overview</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="slotStatusChart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                var ctx = document.getElementById('slotStatusChart');
                if (ctx) {
                    var available = /*[[${availableSlots}]]*/ 0;
                    var occupied = /*[[${occupiedSlots}]]*/ 0;
                    var reserved = /*[[${reservedSlots}]]*/ 0;
                    new Chart(ctx.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Available', 'Occupied', 'Reserved'],
                            datasets: [{
                                data: [available, occupied, reserved],
                                backgroundColor: ['#28a745', '#dc3545', '#ffc107']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }
            });
        </script>
    </div>
</body>
</html>
